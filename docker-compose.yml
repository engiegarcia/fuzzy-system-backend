services:
  backend:
    build: .
    image: proyecto-difuso-backend:1.0.0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # El .env se inyecta como variables de entorno del contenedor (opcional: si no existe, se usan los valores por defecto).
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

